name: Backpressure gate
# Dogfood: run this repo's own action on its pull requests. Needs no secrets, so it is safe on forks.
on:
  pull_request:
permissions:
  contents: read
jobs:
  tamper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
