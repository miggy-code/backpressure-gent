name: Backpressure gate
# Dogfood: run this repo's own action on its pull requests. Needs no secrets, so it is safe on forks.
on:
  pull_request:
    # labeled/unlabeled: adding or removing backpressure-override re-runs the gate. Every label event runs it:
    # skipping the job on other labels would report a skipped (passing) check over a failing one.
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  tamper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
