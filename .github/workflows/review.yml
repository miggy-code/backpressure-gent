name: Backpressure review
# Label a PR `backpressure-review` (write access required) to get one review from the investigating reviewer.
#
# Trust shape, one job per privilege:
#   start   write token, no model key, never runs PR code: checks the requester, posts a status comment.
#   review  model key (environment `review`, main only) and a read-only token: runs PR code only inside
#           the Docker sandbox (no network, no env), writes the review to an artifact.
#   post    write token, no model key, never runs PR code: posts the review and one verdict label.
# Every job checks out the base branch, so the code that runs here is never the PR's.
on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

permissions: {}

concurrency:
  group: backpressure-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

env:
  PR: ${{ github.event.pull_request.number || inputs.pr }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  start:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'backpressure-review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      allowed: ${{ steps.start.outputs.allowed }}
      head_sha: ${{ steps.start.outputs.head_sha }}
      comment_id: ${{ steps.start.outputs.comment_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - id: start
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTER: ${{ github.event.sender.login || github.actor }}
          ALLOW_FORKS: ${{ vars.BACKPRESSURE_ALLOW_FORKS == 'true' && '--allow-forks' || '' }}
        run: |
          uv run --frozen --no-dev backpressure github-start --repo "$GITHUB_REPOSITORY" --pr "$PR" \
            --requester "$REQUESTER" --run-url "$RUN_URL" $ALLOW_FORKS

  review:
    needs: start
    if: needs.start.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: review
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Review
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HEAD_SHA: ${{ needs.start.outputs.head_sha }}
        run: |
          set +e
          uv run --frozen --no-dev backpressure review --repo "$GITHUB_REPOSITORY" --pr "$PR" --head-sha "$HEAD_SHA" --out out
          code=$?
          echo "Review exit code: $code (0 approve, 1 request changes or close, 2 error)"
          test "$code" -le 1
      - name: Show the sandbox environment
        if: always()
        run: test -f out/sandbox-env.json && cat out/sandbox-env.json || echo "no sandbox was started"
      - name: Check the review files hold no secrets
        if: always()
        env:
          KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TOKEN: ${{ github.token }}
        run: |
          test -n "$KEY" && test -n "$TOKEN"
          if [ -d out ] && grep -rqF -e "$KEY" -e "$TOKEN" out; then
            echo "::error::a secret was found in the review files; not uploading them"
            rm -rf out
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backpressure-review
          path: out
          retention-days: 14
          if-no-files-found: ignore

  post:
    needs: [start, review]
    if: always() && needs.start.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: backpressure-review
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.start.outputs.head_sha }}
          COMMENT_ID: ${{ needs.start.outputs.comment_id }}
        run: |
          uv run --frozen --no-dev backpressure github-finish --repo "$GITHUB_REPOSITORY" --pr "$PR" --dir out \
            --comment-id "$COMMENT_ID" --head-sha "$HEAD_SHA" --run-url "$RUN_URL"
